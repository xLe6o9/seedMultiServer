  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar

      - name: Desplegar en VM Backend
        env:
          POSTGRES_URL: jdbc:postgresql://192.168.122.10:5432/db_PostgreSQL_test
          POSTGRES_USER: adminSUSE-POSTGRESQL
          POSTGRES_PASSWORD: admin123
          BACKEND_NAME: seedBackendProject
        run: |
          # Depuración: mostrar qué archivos hay
          echo "Contenido del directorio actual:"
          ls -la

          # Buscar el JAR descargado (puede estar en subcarpeta o con nombre variable)
          JAR_FILE=$(find . -name "*.jar" | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No se encontró ningún archivo JAR"
            exit 1
          fi
          echo "JAR encontrado: $JAR_FILE"

          # Crear directorio de la aplicación
          mkdir -p /home/adminUbuntu-Backend/app

          # Copiar el JAR (mejor copiar que mover, para no perderlo)
          cp "$JAR_FILE" /home/adminUbuntu-Backend/app/backend.jar
          cd /home/adminUbuntu-Backend/app

          # Matar proceso anterior (por puerto o por nombre)
          fuser -k 8080/tcp 2>/dev/null || true
          pkill -f 'backend.jar' || true

          # Esperar a que se libere el puerto
          sleep 2

          # Ejecutar el JAR con la ruta absoluta de Java
          # Primero localizamos java
          JAVA_CMD=$(which java || echo "/usr/bin/java")
          echo "Usando Java: $JAVA_CMD"

          # Lanzar la aplicación y guardar su PID
          nohup $JAVA_CMD -jar backend.jar > app.log 2>&1 &
          PID=$!
          echo "Aplicación lanzada con PID: $PID"

          # Esperar un momento y verificar si el proceso sigue vivo
          sleep 3
          if kill -0 $PID 2>/dev/null; then
            echo "✅ Aplicación en ejecución (PID $PID)"
          else
            echo "❌ La aplicación falló al iniciar. Mostrando app.log:"
            cat app.log
            exit 1
          fi

          # Mostrar contenido de app.log (primeras líneas)
          echo "Primeras líneas de app.log:"
          head -20 app.log
