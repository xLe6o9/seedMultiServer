# Nombre del workflow (aparece en la pestaña Actions)
name: CI/CD Pipeline

# Eventos que activan el workflow
on:
  push:
    branches: [ "main" ]       # Se ejecuta al hacer push a la rama main
  pull_request:
    branches: [ "main" ]       # También al crear/actualizar un pull request hacia main

# Definición de los trabajos (jobs)
jobs:
  # ------------------------------------------------------------
  # TRABAJO DE INTEGRACIÓN CONTINUA (CI)
  # Compila y empaqueta la aplicación Spring Boot
  # Se ejecuta en un runner estándar de GitHub (ubuntu-latest)
  # ------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Descarga el código fuente del repositorio
      - name: Clonar código
        uses: actions/checkout@v4

      # 2. Instala y configura JDK 21 (necesario para compilar)
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Compila el proyecto, ejecuta las pruebas y genera el archivo .jar
      - name: Compilar con Maven
        run: mvn clean package

      # 4. Guarda el archivo .jar generado como "artefacto" para usarlo en otros jobs
      - name: Subir artefacto (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar          # Nombre del artefacto
          path: target/*.jar         # Ruta del archivo generado

  # ------------------------------------------------------------
  # TRABAJO DE DESPLIEGUE CONTINUO (CD)
  # Toma el .jar del trabajo anterior y lo despliega en tu VM local
  # Se ejecuta en un "self-hosted runner" (tu máquina Ubuntu Backend)
  # ------------------------------------------------------------
  deploy:
    needs: build                  # Espera a que 'build' termine correctamente
    runs-on: self-hosted          # Usa el runner que instalaste en tu VM

    steps:
      # 1. Descarga el artefacto (el .jar) que subió el trabajo 'build'
      - name: Descargar JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar

      # 2. Despliega la aplicación en el servidor backend
      - name: Desplegar en VM Backend
        env:
          # Variables de entorno que necesita tu application.yml
          POSTGRES_URL: jdbc:postgresql://192.168.122.10:5432/db_PostgreSQL_test
          POSTGRES_USER: adminSUSE-POSTGRESQL
          POSTGRES_PASSWORD: admin123
          BACKEND_NAME: seedBackendProject
        run: |
          set -e   # Detiene el script si falla algún comando

          echo "=== DEPURACIÓN: directorio de trabajo ==="
          pwd
          ls -la

          # Busca el archivo .jar descargado (puede estar en subcarpetas)
          JAR_FILE=$(find . -name "*.jar" | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No se encontró ningún archivo JAR"
            exit 1
          fi
          echo "JAR encontrado: $JAR_FILE"

          # Crea el directorio donde vivirá la aplicación (si no existe)
          mkdir -p /home/adminUbuntu-Backend/app

          # Copia el JAR a la carpeta de la aplicación
          cp "$JAR_FILE" /home/adminUbuntu-Backend/app/backend.jar
          cd /home/adminUbuntu-Backend/app

          # Exporta las variables de entorno (por si el runner no las hereda)
          export POSTGRES_URL="$POSTGRES_URL"
          export POSTGRES_USER="$POSTGRES_USER"
          export POSTGRES_PASSWORD="$POSTGRES_PASSWORD"
          export BACKEND_NAME="$BACKEND_NAME"

          # Muestra la ruta de Java (diagnóstico)
          echo "Ruta de Java encontrada por which: $(which java || echo 'NO ENCONTRADO')"
          # Usa la ruta absoluta que funcionó en las pruebas manuales
          JAVA_CMD="/usr/bin/java"
          echo "Usando Java: $JAVA_CMD"

          # Detiene cualquier versión anterior de la aplicación
          pkill -f 'backend.jar' || true
          sleep 2

          # Lanza la nueva versión en segundo plano y redirige logs a app.log
          nohup $JAVA_CMD -jar backend.jar > app.log 2>&1 &
          PID=$!
          echo "Aplicación lanzada con PID: $PID"

          # Espera 5 segundos y verifica que el proceso siga vivo
          sleep 5
          if kill -0 $PID 2>/dev/null; then
            echo "✅ Aplicación en ejecución (PID $PID)"
            echo "=== Últimas líneas de app.log ==="
            tail -30 app.log
          else
            echo "❌ La aplicación falló al iniciar. Mostrando app.log completo:"
            cat app.log
            exit 1
          fi
