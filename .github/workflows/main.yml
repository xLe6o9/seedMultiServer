name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build with Maven
        run: mvn clean package
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
      - name: Desplegar en VM Backend
        env:
          POSTGRES_URL: jdbc:postgresql://192.168.122.10:5432/db_PostgreSQL_test
          POSTGRES_USER: adminSUSE-POSTGRESQL
          POSTGRES_PASSWORD: admin123
          # Si tu aplicación usa otros perfiles, puedes forzar el perfil activo
          SPRING_PROFILES_ACTIVE: dev
        run: |
          # Crear directorio si no existe
          mkdir -p /home/adminUbuntu-Backend/app
          # Mover el JAR descargado (solo hay uno)
          mv *.jar /home/adminUbuntu-Backend/app/backend.jar
          cd /home/adminUbuntu-Backend/app
          # Detener proceso anterior si existe
          pkill -f 'java -jar backend.jar' || true
          # Usamos la ruta absoluta de java para evitar problemas de PATH
          nohup /usr/bin/java -jar backend.jar > app.log 2>&1 &
          echo "Despliegue completado. PID: $!"
