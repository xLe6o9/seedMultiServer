# Nombre del workflow (aparece en la pestaña Actions)
name: CI/CD Pipeline

# Eventos que activan el workflow
on:
  push:
    branches: [ "main" ]       # Se ejecuta al hacer push a la rama main
  pull_request:
    branches: [ "main" ]       # También al crear/actualizar un pull request hacia main

# Definición de los trabajos (jobs)
jobs:
  # ------------------------------------------------------------
  # TRABAJO DE INTEGRACIÓN CONTINUA (CI)
  # Compila y empaqueta la aplicación Spring Boot
  # Se ejecuta en un runner estándar de GitHub (ubuntu-latest)
  # ------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Descarga el código fuente del repositorio
      - name: Clonar código
        uses: actions/checkout@v4

      # 2. Instala y configura JDK 21 (necesario para compilar)
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Compila el proyecto, ejecuta las pruebas y genera el archivo .jar
      - name: Compilar con Maven
        run: mvn clean package

      # 4. Guarda el archivo .jar generado como "artefacto" para usarlo en otros jobs
      - name: Subir artefacto (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar          # Nombre del artefacto
          path: target/*.jar         # Ruta del archivo generado

  # ------------------------------------------------------------
  # TRABAJO DE DESPLIEGUE CONTINUO (CD)
  # Toma el .jar del trabajo anterior y lo despliega en tu VM local
  # Se ejecuta en un "self-hosted runner" (tu máquina Ubuntu Backend)
  # ------------------------------------------------------------
  deploy:
    needs: build                  # Espera a que 'build' termine correctamente
    runs-on: self-hosted          # Usa el runner que instalaste en tu VM

    steps:
      # 1. Descarga el artefacto (el .jar) que subió el trabajo 'build'
      - name: Descargar JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar

      # 2. Despliega la aplicación usando systemd (método profesional)
      - name: Desplegar con systemd
        run: |
          # Depuración: mostrar qué archivos hay
          echo "=== Depuración: directorio de trabajo ==="
          pwd
          ls -la

          # Busca el archivo .jar descargado (puede estar en subcarpeta)
          JAR_FILE=$(find . -name "*.jar" | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No se encontró ningún archivo JAR"
            exit 1
          fi
          echo "JAR encontrado: $JAR_FILE"

          # Crear directorio de la aplicación (si no existe)
          mkdir -p /home/adminUbuntu-Backend/app

          # Copiar el nuevo JAR a la ubicación definitiva
          cp "$JAR_FILE" /home/adminUbuntu-Backend/app/backend.jar
          echo "JAR copiado a /home/adminUbuntu-Backend/app/backend.jar"

          # Reiniciar el servicio systemd (esto levanta la nueva versión)
          # Nota: el usuario adminUbuntu-Backend tiene sudo sin contraseña solo para este comando
          sudo systemctl restart backend

          # Verificar que el servicio se haya reiniciado correctamente
          sleep 5
          if sudo systemctl is-active --quiet backend; then
            echo "✅ Servicio backend reiniciado correctamente"
            echo "=== Últimas líneas del log del servicio ==="
            sudo journalctl -u backend -n 30 --no-pager
          else
            echo "❌ El servicio falló al reiniciar"
            sudo systemctl status backend --no-pager
            exit 1
          fi
